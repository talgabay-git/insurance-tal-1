  <style>
    .error-page {

      display: flex;

    }

      color: rgba(255,255,255,0.65);

    .error-logo {

      align-items: center;
      gap: .5rem;
    }
    .error-logo span { color: var(--gold); }

<body>

  <!-- ===== רכיב נגישות ===== -->
  <div class="a11y-widget" id="a11y-widget">
    <button class="a11y-toggle" id="a11y-toggle" aria-label="אפשרויות נגישות" aria-expanded="false">
      <i class="fa-solid fa-universal-access"></i>
    </button>
    <div class="a11y-panel" id="a11y-panel" role="dialog" aria-label="תפריט נגישות" aria-hidden="true">
      <div class="a11y-panel-title">נגישות</div>
      <button class="a11y-btn" id="a11y-font-up" aria-label="הגדל גופן"><i class="fa-solid fa-plus"></i> הגדל טקסט</button>
      <button class="a11y-btn" id="a11y-font-down" aria-label="הקטן גופן"><i class="fa-solid fa-minus"></i> הקטן טקסט</button>
      <button class="a11y-btn" id="a11y-contrast" aria-label="ניגודיות גבוהה"><i class="fa-solid fa-circle-half-stroke"></i> ניגודיות גבוהה</button>
      <button class="a11y-btn" id="a11y-animations" aria-label="עצור אנימציות"><i class="fa-solid fa-pause"></i> עצור אנימציות</button>
      <button class="a11y-btn" id="a11y-links" aria-label="הדגש קישורים"><i class="fa-solid fa-link"></i> הדגש קישורים</button>
      <button class="a11y-btn" id="a11y-spacing" aria-label="ריווח טקסט"><i class="fa-solid fa-text-width"></i> ריווח טקסט</button>
      <button class="a11y-btn" id="a11y-keyboard" aria-label="ניווט מקלדת"><i class="fa-solid fa-keyboard"></i> ניווט מקלדת</button>
      <button class="a11y-btn a11y-reset" id="a11y-reset" aria-label="איפוס הגדרות"><i class="fa-solid fa-rotate-left"></i> איפוס</button>
    </div>
  </div>
  <script>
  (function(){
    var t=document.getElementById('a11y-toggle'),p=document.getElementById('a11y-panel');
    var fs=parseInt(localStorage.getItem('a11y-fs')||'16');
    var hc=localStorage.getItem('a11y-hc')==='1';
    var na=localStorage.getItem('a11y-na')==='1';
    var hl=localStorage.getItem('a11y-hl')==='1';
    var ts=localStorage.getItem('a11y-ts')==='1';
    function apply(){
      document.documentElement.style.fontSize=fs+'px';
      document.body.classList.toggle('high-contrast',hc);
      document.body.classList.toggle('no-animations',na);
      document.body.classList.toggle('highlight-links',hl);
      document.body.classList.toggle('text-spacing',ts);
      document.getElementById('a11y-contrast').classList.toggle('active',hc);
      document.getElementById('a11y-animations').classList.toggle('active',na);
      document.getElementById('a11y-links').classList.toggle('active',hl);
      document.getElementById('a11y-spacing').classList.toggle('active',ts);
    }
    apply();
    t.addEventListener('click',function(){
      var o=p.classList.toggle('open');
      t.setAttribute('aria-expanded',o);
      p.setAttribute('aria-hidden',!o);
    });
    document.getElementById('a11y-font-up').addEventListener('click',function(){if(fs<22){fs+=2;localStorage.setItem('a11y-fs',fs);apply();}});
    document.getElementById('a11y-font-down').addEventListener('click',function(){if(fs>12){fs-=2;localStorage.setItem('a11y-fs',fs);apply();}});
    document.getElementById('a11y-contrast').addEventListener('click',function(){hc=!hc;localStorage.setItem('a11y-hc',hc?'1':'0');apply();});
    document.getElementById('a11y-animations').addEventListener('click',function(){na=!na;localStorage.setItem('a11y-na',na?'1':'0');apply();});
    document.getElementById('a11y-links').addEventListener('click',function(){hl=!hl;localStorage.setItem('a11y-hl',hl?'1':'0');apply();});
    document.getElementById('a11y-spacing').addEventListener('click',function(){ts=!ts;localStorage.setItem('a11y-ts',ts?'1':'0');apply();});
    document.getElementById('a11y-reset').addEventListener('click',function(){fs=16;hc=false;na=false;hl=false;ts=false;localStorage.removeItem('a11y-fs');localStorage.removeItem('a11y-hc');localStorage.removeItem('a11y-na');localStorage.removeItem('a11y-hl');localStorage.removeItem('a11y-ts');apply();});
    document.addEventListener('click',function(e){if(!document.getElementById('a11y-widget').contains(e.target)){p.classList.remove('open');t.setAttribute('aria-expanded','false');p.setAttribute('aria-hidden','true');}});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&p.classList.contains('open')){p.classList.remove('open');t.setAttribute('aria-expanded','false');p.setAttribute('aria-hidden','true');t.focus();}});
  })();
  </script>
  <script>
  (function(){
    var kn=localStorage.getItem('a11y-kn')==='1';
    var kb=document.getElementById('a11y-keyboard');
    function applyKn(){
      document.body.classList.toggle('keyboard-nav',kn);
      if(kb)kb.classList.toggle('active',kn);
    }
    applyKn();
    if(kb)kb.addEventListener('click',function(){kn=!kn;localStorage.setItem('a11y-kn',kn?'1':'0');applyKn();});
    var rb=document.getElementById('a11y-reset');
    if(rb)rb.addEventListener('click',function(){kn=false;localStorage.removeItem('a11y-kn');applyKn();});
  })();
  </script>

  <!-- ===== COOKIE CONSENT BANNER ===== -->
  <div id="cookie-banner" role="dialog" aria-label="הסכמה לעוגיות" aria-live="polite" style="display:none;position:fixed;bottom:0;right:0;left:0;z-index:99999;background:#0d1e35;color:#fff;padding:1rem 1.5rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;box-shadow:0 -2px 12px rgba(0,0,0,.35);font-family:'Heebo',sans-serif;font-size:.92rem;line-height:1.5;">
    <p style="margin:0;flex:1 1 260px;">אתר זה משתמש ב<strong>Google Analytics</strong> לצורך ניתוח תנועת גולשים בלבד. לא נאסף מידע אישי מזהה. <a href="privacy-policy.html" style="color:#c9a84c;text-decoration:underline;">מדיניות פרטיות</a></p>
    <div style="display:flex;gap:.6rem;flex-shrink:0;">
      <button id="cookie-accept" style="background:#c9a84c;color:#0d1e35;border:none;border-radius:6px;padding:.45rem 1.1rem;font-weight:700;cursor:pointer;font-size:.9rem;">אני מסכים</button>
      <button id="cookie-decline" style="background:transparent;color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:.45rem 1.1rem;cursor:pointer;font-size:.9rem;">דחה</button>
    </div>
  </div>
  <script>
  (function(){
    var b=document.getElementById('cookie-banner');
    var consent=localStorage.getItem('cookie-consent');
    if(!consent) b.style.display='flex';
    document.getElementById('cookie-accept').addEventListener('click',function(){
      localStorage.setItem('cookie-consent','accepted');
      b.style.display='none';
    });
    document.getElementById('cookie-decline').addEventListener('click',function(){
      localStorage.setItem('cookie-consent','declined');
      b.style.display='none';
      // disable GA
      window['ga-disable-G-5F91Q1DPZV']=true;
    });
    // if previously declined, disable GA
    if(consent==='declined') window['ga-disable-G-5F91Q1DPZV']=true;
  })();
  </script>
  <script src="tuli-bot.js"></script>
  <script src="/pwa-init.js"></script>
</body>
